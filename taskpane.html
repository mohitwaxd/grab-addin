<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telecrm Sync Pro</title>
    <style>
        /* Same color palette as appscript.html (Telecrm purple + blue loader) */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 0; margin: 0; background-color: #FFF; color: #333; position: relative; min-height: 100vh; }
        .header { background: #4F38A2; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .container { padding: 20px; }
        .card { background: white; border-radius: 4px; padding: 15px; box-shadow: 0 1.6px 3.6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .ms-Button { background: #4F38A2; color: white; border: none; padding: 12px; width: 100%; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 2px; }
        .ms-Button:hover { background: #6a5acd; }
        .ms-Button:disabled { background: #c8c6c4; cursor: not-allowed; }

        .progress-container { margin-top: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
        .progress-bg { background: rgba(66, 133, 244, 0.2); height: 12px; width: 100%; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: #4285f4; height: 100%; width: 0%; transition: width 0.3s ease; }

        .log-box { background: #ffffff; border: 1px solid #e0e0e0; height: 200px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; padding: 10px; margin-top: 10px; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #f3f2f1; padding-bottom: 2px; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        .summary-stats { font-size: 13px; margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; }
        .summary-stats .stat-line { margin: 4px 0; }
        .summary-failed-list { font-size: 12px; margin-top: 10px; max-height: 180px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; background: #fff; }
        .summary-failed-list .failed-item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .summary-failed-list .failed-item:last-child { border-bottom: none; }
        .segment-control { display: flex; background: #F7F4FA; border-radius: 8px; padding: 5px; margin: 12px 0; }
        .segment-control button { flex: 1; border: none; padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; color: #6b50a0; border-radius: 6px; }
        .segment-control button.active { background: #FFF; color: #4a3882; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .segment-control button:hover:not(.active) { background: rgba(255,255,255,0.6); }
        .range-preview { border: 1px solid #e0e0e0; padding: 8px 12px; border-radius: 4px; background: #f9f9f9; margin-bottom: 12px; font-size: 13px; color: #555; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .footer { font-size: 10px; color: #888; text-align: center; margin-top: 20px; }

        /* Overlay loader (same as AppScript getEnhancedLoaderStyles) */
        .telecrm-loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .telecrm-loader-overlay[hidden] { display: none; }
        .telecrm-loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        .telecrm-loader-message {
            color: #555;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .telecrm-loader-status {
            color: #888;
            font-size: 12px;
            text-align: center;
            max-width: 220px;
        }
        .telecrm-progress-container {
            width: 180px;
            height: 4px;
            background-color: rgba(66, 133, 244, 0.2);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }
        .telecrm-progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4285f4;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Overlay loader (shown while loading / sending - same as AppScript) -->
    <div id="telecrm-loader-overlay" class="telecrm-loader-overlay" hidden>
        <div class="telecrm-loader-content">
            <div id="telecrm-loader-message" class="telecrm-loader-message">Loading...</div>
            <div id="telecrm-loader-status" class="telecrm-loader-status"></div>
            <div id="telecrm-progress-container" class="telecrm-progress-container">
                <div id="telecrm-progress-bar" class="telecrm-progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>Telecrm Lead Sync</h1>
    </div>

    <div class="container">
        <div class="card">
            <p style="margin-top:0; font-size: 13px;">Choose a custom range or send all data to Telecrm.</p>

            <div class="segment-control">
                <button type="button" id="custom-segment" class="active">Custom</button>
                <button type="button" id="all-data-segment">All Data</button>
            </div>

            <div id="range-preview" class="range-preview">Loading sheet info...</div>

            <div class="form-group">
                <label for="start-range">Start Cell:</label>
                <input type="text" id="start-range" placeholder="e.g. A2">
            </div>
            <div class="form-group">
                <label for="end-range">End Cell:</label>
                <input type="text" id="end-range" placeholder="e.g. G100">
            </div>

            <button id="run-button" class="ms-Button">Send Data</button>
            
            <div id="progress-area" style="display:none;" class="progress-container">
                <div class="progress-label">
                    <span id="status-text">Processing...</span>
                    <span id="percent-text">0%</span>
                </div>
                <div class="progress-bg">
                    <div id="progress-bar" class="progress-fill"></div>
                </div>
            </div>
        </div>


        <div id="summary-card" class="card summary-card" style="display: none;">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Sync overview</div>
            <div id="summary-stats" class="summary-stats"></div>
            <div id="summary-failed-list" class="summary-failed-list" style="display: none;"></div>
        </div>

        <div class="card">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 5px;">Activity Logs</div>
            <div id="log-box" class="log-box">
                <div class="log-entry">Ready. Click "Send All Data to CRM" to sync.</div>
            </div>
        </div>

        <div class="footer">Connected to Telecrm API v2.0</div>
    </div>

    <!-- Load Office.js first so it runs before our script (required for Office.onReady) -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script>
        // Office.js requirement: call Office.onReady() as the first thing in your loading sequence.
        // See https://learn.microsoft.com/en-us/office/dev/add-ins/develop/initialize-add-in
        (function() {
            if (typeof Office === "undefined") {
                console.error("Office.js is not loaded. Run this add-in inside Excel.");
                return;
            }
            Office.onReady(function(info) {
                if (info.host === Office.HostType.Excel) {
                    var runBtn = document.getElementById("run-button");
                    if (runBtn) runBtn.onclick = handleSync;
                    bindSegmentControls();
                    loadSheetInfo();
                }
            });
        })();

        var currentSendMode = "custom";
        var allDataRange = "";
        var totalRowsAll = 0;

        function columnToLetter(n) {
            var letter = "";
            while (n > 0) {
                var t = (n - 1) % 26;
                letter = String.fromCharCode(65 + t) + letter;
                n = (n - t - 1) / 26;
            }
            return letter;
        }

        function getRowFromCell(cell) {
            var m = (cell || "").toUpperCase().match(/[A-Z]+(\d+)/);
            return m ? parseInt(m[1], 10) : null;
        }

        function bindSegmentControls() {
            var customSeg = document.getElementById("custom-segment");
            var allDataSeg = document.getElementById("all-data-segment");
            var startInput = document.getElementById("start-range");
            var endInput = document.getElementById("end-range");
            if (customSeg) customSeg.onclick = setCustom;
            if (allDataSeg) allDataSeg.onclick = setAllData;
            if (startInput) startInput.addEventListener("input", onCustomInput);
            if (endInput) endInput.addEventListener("input", onCustomInput);
        }

        function setCustom() {
            currentSendMode = "custom";
            var customSeg = document.getElementById("custom-segment");
            var allDataSeg = document.getElementById("all-data-segment");
            var startInput = document.getElementById("start-range");
            var endInput = document.getElementById("end-range");
            if (customSeg) customSeg.classList.add("active");
            if (allDataSeg) allDataSeg.classList.remove("active");
            if (startInput) { startInput.readOnly = false; startInput.value = ""; }
            if (endInput) { endInput.readOnly = false; endInput.value = ""; }
            updatePreview("Please enter a custom range.", "#555");
            updateSendButton();
        }

        function setAllData() {
            currentSendMode = "allData";
            var customSeg = document.getElementById("custom-segment");
            var allDataSeg = document.getElementById("all-data-segment");
            var startInput = document.getElementById("start-range");
            var endInput = document.getElementById("end-range");
            if (customSeg) customSeg.classList.remove("active");
            if (allDataSeg) allDataSeg.classList.add("active");
            var parts = allDataRange.split(":");
            if (parts.length === 2) {
                if (startInput) { startInput.value = parts[0]; startInput.readOnly = true; }
                if (endInput) { endInput.value = parts[1]; endInput.readOnly = true; }
            }
            updatePreview("Range set to: " + allDataRange, "#4285f4");
            updateSendButton();
        }

        function updatePreview(msg, color) {
            var p = document.getElementById("range-preview");
            if (p) { p.textContent = msg; p.style.color = color || "#555"; }
        }

        function updateSendButton() {
            var btn = document.getElementById("run-button");
            if (!btn) return;
            var count = 0;
            if (currentSendMode === "allData") {
                count = totalRowsAll;
            } else {
                var s = (document.getElementById("start-range") || {}).value || "";
                var e = (document.getElementById("end-range") || {}).value || "";
                var r1 = getRowFromCell(s), r2 = getRowFromCell(e);
                if (r1 !== null && r2 !== null && r2 >= r1) count = r2 - r1 + 1;
            }
            btn.textContent = count > 0 ? "Send Data (" + count + " rows)" : "Send Data";
        }

        function onCustomInput() {
            if (currentSendMode !== "custom") return;
            var s = (document.getElementById("start-range") || {}).value.toUpperCase();
            var e = (document.getElementById("end-range") || {}).value.toUpperCase();
            var r1 = getRowFromCell(s), r2 = getRowFromCell(e);
            if (r1 === null || r2 === null) updatePreview("Please enter a custom range.", "#555");
            else if (r2 < r1) updatePreview("Invalid range: end before start", "#dc3545");
            else updatePreview("Range: " + s + ":" + e, "#4285f4");
            updateSendButton();
        }

        function loadSheetInfo() {
            Excel.run(function(context) {
                var sheet = context.workbook.worksheets.getActiveWorksheet();
                var range = sheet.getUsedRange();
                range.load("values");
                return context.sync().then(function() {
                    var rows = range.values;
                    if (!rows || rows.length === 0) {
                        allDataRange = "";
                        totalRowsAll = 0;
                        updatePreview("No data in sheet.", "#555");
                        return;
                    }
                    var lastRow = rows.length;
                    var lastCol = rows[0].length;
                    totalRowsAll = Math.max(0, lastRow - 1);
                    allDataRange = "A2:" + columnToLetter(lastCol) + lastRow;
                    if (currentSendMode === "custom") updatePreview("Please enter a custom range.", "#555");
                    updateSendButton();
                });
            }).catch(function() {
                updatePreview("Could not load sheet.", "#dc3545");
            });
        }

        // CONFIGURATION: Replace with your actual details
        var CONFIG = {
            enterpriseId: "69805f72c16a92668f3d8947",
            token: "b6aaa8fd-bfeb-402b-b6f5-b824d25bea551771244755802:1e527ab6-63d4-4f5e-b5d9-f27b454798c9",
            apiUrl: function(id) { return "https://next-api.telecrm.in/enterprise/69805f72c16a92668f3d8947/autoupdatelead"; }
        };

        var LOG_SHEET_NAME = "Telecrm Sync Log";
        var LOG_HEADERS = ["Date/Time", "Excel Row", "Phone", "GID", "GID Status", "Store Name", "Store ID", "DOO", "DOA", "Status", "Payload", "Response Code"];
        var LOG_COLUMNS = 12;

        // ----- Loader helpers (same UX as AppScript Send Data dialog) -----
        function showTelecrmLoader(message, status) {
            var overlay = document.getElementById("telecrm-loader-overlay");
            var msgEl = document.getElementById("telecrm-loader-message");
            var statusEl = document.getElementById("telecrm-loader-status");
            var progressContainer = document.getElementById("telecrm-progress-container");
            if (overlay) {
                if (msgEl) msgEl.textContent = message || "Loading...";
                if (statusEl) statusEl.textContent = status || "";
                progressContainer.style.display = "block";
                overlay.hidden = false;
            }
        }
        function hideTelecrmLoader() {
            var overlay = document.getElementById("telecrm-loader-overlay");
            if (overlay) {
                overlay.style.opacity = "0";
                setTimeout(function() {
                    overlay.hidden = true;
                    overlay.style.opacity = "1";
                }, 300);
            }
        }
        function updateTelecrmLoaderStatus(status) {
            var el = document.getElementById("telecrm-loader-status");
            if (el) el.textContent = status;
        }
        function updateTelecrmProgress(percent) {
            var bar = document.getElementById("telecrm-progress-bar");
            if (bar) bar.style.width = (percent || 0) + "%";
        }
        function showTelecrmSuccess(message) {
            addLog("✓ " + message, "success");
        }

        /** Convert Excel serial date (e.g. 46045) to DD/MM/YYYY for Telecrm. Sheet shows 1/23/2026 → send 23/01/2026. Leaves non-numeric as-is. */
        function excelDateToDDMMYYYY(val) {
            if (val === null || val === undefined || val === "") return "";
            var n = Number(val);
            if (isNaN(n) || n < 1) return String(val).trim();
            var date = new Date((n - 25569) * 86400 * 1000);
            if (isNaN(date.getTime())) return String(val).trim();
            var dd = date.getDate();
            var mm = date.getMonth() + 1;
            var yyyy = date.getFullYear();
            return (dd < 10 ? "0" : "") + dd + "/" + (mm < 10 ? "0" : "") + mm + "/" + yyyy;
        }

        async function handleSync() {
            var btn = document.getElementById("run-button");
            var progressArea = document.getElementById("progress-area");
            var progressBar = document.getElementById("progress-bar");
            var percentText = document.getElementById("percent-text");
            var statusText = document.getElementById("status-text");
            var logBox = document.getElementById("log-box");
            var summaryCard = document.getElementById("summary-card");
            var summaryStats = document.getElementById("summary-stats");
            var summaryFailedList = document.getElementById("summary-failed-list");

            btn.disabled = true;
            progressArea.style.display = "block";
            logBox.innerHTML = "";
            summaryCard.style.display = "none";

            var startCell = (document.getElementById("start-range") || {}).value || "";
            var endCell = (document.getElementById("end-range") || {}).value || "";
            if (currentSendMode === "custom") {
                var r1 = getRowFromCell(startCell), r2 = getRowFromCell(endCell);
                if (r1 === null || r2 === null) {
                    addLog("Enter valid cell references (e.g. A2, D10).", "error");
                    btn.disabled = false;
                    return;
                }
                if (r2 < r1) {
                    addLog("End cell must be on or after start cell.", "error");
                    btn.disabled = false;
                    return;
                }
            }

            showTelecrmLoader("Processing", "Reading sheet data...");
            updateTelecrmProgress(10);

            try {
                var result = await Excel.run(async (context) => {
                    var sheet = context.workbook.worksheets.getActiveWorksheet();
                    var range = null;
                    var dataRows = [];
                    var firstExcelRow = 1;

                    if (currentSendMode === "allData") {
                        range = sheet.getUsedRange();
                        range.load("values");
                    } else {
                        range = sheet.getRange(startCell + ":" + endCell);
                        range.load("values");
                    }

                    // Ensure "Telecrm Sync Log" sheet exists
                    var allSheets = context.workbook.worksheets;
                    allSheets.load("items/name");
                    await context.sync();

                    var names = allSheets.items.map(function(s) { return s.name; });
                    var logSheet = null;
                    var logLastRow = 0;
                    if (names.indexOf(LOG_SHEET_NAME) === -1) {
                        logSheet = context.workbook.worksheets.add(LOG_SHEET_NAME);
                        await context.sync();
                        var headerRange = logSheet.getRange("A1:L1");
                        headerRange.values = [LOG_HEADERS];
                        headerRange.format.font.bold = true;
                        logLastRow = 1;
                    } else {
                        logSheet = context.workbook.worksheets.getItem(LOG_SHEET_NAME);
                        var logUsed = logSheet.getUsedRange();
                        logUsed.load("rowCount");
                        await context.sync();
                        logLastRow = logUsed.rowCount;
                        if (logLastRow === 0) {
                            var headerRange = logSheet.getRange("A1:L1");
                            headerRange.values = [LOG_HEADERS];
                            headerRange.format.font.bold = true;
                            logLastRow = 1;
                        }
                    }
                    await context.sync();

                    var rows = range.values;
                    if (currentSendMode === "allData") {
                        dataRows = rows.length > 1 ? rows.slice(1) : [];
                        firstExcelRow = 2;
                    } else {
                        var startRowNum = getRowFromCell(startCell);
                        if (startRowNum === 1) {
                            dataRows = rows.length > 1 ? rows.slice(1) : [];
                            firstExcelRow = 2;
                        } else {
                            dataRows = rows;
                            firstExcelRow = startRowNum;
                        }
                    }

                    var dataLength = dataRows.length;
                    if (dataLength <= 0) {
                        return { total: 0, success: 0, failed: 0, failedRows: [] };
                    }

                    updateTelecrmLoaderStatus("Sending to Telecrm...");
                    updateTelecrmProgress(20);

                    var successCount = 0;
                    var failCount = 0;
                    var failedRows = [];
                    var logRows = [];
                    var runTime = new Date().toLocaleString();

                    for (var i = 0; i < dataRows.length; i++) {
                        var row = dataRows[i];
                        var excelRowNum = currentSendMode === "allData" ? (i + 2) : (firstExcelRow + i);
                        var phoneVal = String(row[0] || "");
                        var gidVal = String(row[1] || "");
                        var gidStatus = String(row[2] || "");
                        var store_name = String(row[3] || "");
                        var store_id = String(row[4] || "");
                        var doo = excelDateToDDMMYYYY(row[5]);
                        var doa = excelDateToDDMMYYYY(row[6]);
                        var payload = {
                            "fields": {
                                "phone": phoneVal,
                                "gid": gidVal,
                                "gid_status_1": gidStatus,
                                "store_name": store_name,
                                "store_id": store_id,
                                "doo": doo,
                                "doa": doa
                            },
                            "actions": [{ "type": "ACTION_1002", "fields": { "notes": "Excel Add-in Sync", "gid_status": gidStatus } }]
                        };
                        var payloadStr = JSON.stringify(payload);

                        addLog("Row " + excelRowNum + " payload: " + payloadStr, "");

                        var status = "Success";
                        var responseCode = "";

                        try {
                            var response = await fetch(CONFIG.apiUrl(CONFIG.enterpriseId), {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    "Authorization": "Bearer " + CONFIG.token
                                },
                                body: payloadStr
                            });

                            responseCode = response.status.toString();

                            if (response.ok) {
                                successCount++;
                                addLog("Row " + excelRowNum + ": Success - " + (store_name || phoneVal || "-"), "success");
                            } else {
                                failCount++;
                                status = "Failed";
                                addLog("Row " + excelRowNum + ": Failed (" + response.status + ")", "error");
                                failedRows.push({
                                    rowIndex: excelRowNum,
                                    phone: phoneVal,
                                    gid: gidVal,
                                    gid_status: gidStatus,
                                    store_name: store_name,
                                    store_id: store_id,
                                    doo: doo,
                                    doa: doa,
                                    error: "HTTP " + response.status
                                });
                            }
                        } catch (e) {
                            failCount++;
                            status = "Failed";
                            responseCode = e.message || "Network Error";
                            addLog("Row " + excelRowNum + ": " + responseCode, "error");
                            failedRows.push({
                                rowIndex: excelRowNum,
                                phone: phoneVal,
                                gid: gidVal,
                                gid_status: gidStatus,
                                store_name: store_name,
                                store_id: store_id,
                                doo: doo,
                                doa: doa,
                                error: responseCode
                            });
                        }

                        logRows.push([runTime, excelRowNum, phoneVal, gidVal, gidStatus, store_name, store_id, doo, doa, status, payloadStr, responseCode]);

                        var progress = 20 + Math.round(((i + 1) / dataLength) * 78);
                        updateTelecrmProgress(progress);
                        updateTelecrmLoaderStatus("Sending " + (i + 1) + " of " + dataLength + "...");
                        progressBar.style.width = progress + "%";
                        percentText.innerText = Math.round(((i + 1) / dataLength) * 100) + "%";
                        statusText.innerText = "Syncing " + (i + 1) + " of " + dataLength;
                    }

                    updateTelecrmProgress(100);
                    updateTelecrmLoaderStatus("Complete!");
                    statusText.innerText = "Synchronization Complete!";
                    addLog("--- Finished ---", "");

                    // Write every row + summary to log sheet (same fields as pushed + Status, Payload, Response Code)
                    var totalRows = dataLength;
                    var rowsToWrite = logRows.slice();
                    rowsToWrite.push(["", "", "--- Summary ---", "Success: " + successCount, "Failed: " + failCount, "Total: " + totalRows, "", "", "", "", "", ""]);

                    if (rowsToWrite.length > 0) {
                        var startRow = logLastRow + 1;
                        var endRow = logLastRow + rowsToWrite.length;
                        var writeRange = logSheet.getRange("A" + startRow + ":L" + endRow);
                        writeRange.values = rowsToWrite;
                    }

                    await context.sync();
                    return { total: totalRows, success: successCount, failed: failCount, failedRows: failedRows };
                });

                hideTelecrmLoader();
                showSummary(result);
            } catch (error) {
                hideTelecrmLoader();
                addLog("Error: " + error, "error");
                showSummary({ total: 0, success: 0, failed: 0, failedRows: [] });
            } finally {
                btn.disabled = false;
            }
        }

        function showSummary(result) {
            var summaryCard = document.getElementById("summary-card");
            var summaryStats = document.getElementById("summary-stats");
            var summaryFailedList = document.getElementById("summary-failed-list");
            if (!result || result.total === 0) {
                summaryCard.style.display = "none";
                return;
            }
            summaryCard.style.display = "block";
            var html = "<div class=\"stat-line\"><strong>Total rows:</strong> " + result.total + "</div>";
            html += "<div class=\"stat-line\"><span class=\"success\">Success:</span> " + result.success + "</div>";
            html += "<div class=\"stat-line\"><span class=\"error\">Failed:</span> " + result.failed + "</div>";
            html += "<div class=\"stat-line\" style=\"margin-top:8px;font-size:11px;color:#888;\">Failed details are logged in the \"" + LOG_SHEET_NAME + "\" sheet.</div>";
            summaryStats.innerHTML = html;

            if (result.failedRows && result.failedRows.length > 0) {
                summaryFailedList.style.display = "block";
                var listHtml = "<div style=\"font-weight:600;margin-bottom:6px;\">Failed rows:</div>";
                for (var i = 0; i < result.failedRows.length; i++) {
                    var fr = result.failedRows[i];
                    listHtml += "<div class=\"failed-item\">Row " + fr.rowIndex + " | " + (fr.phone || "-") + " | " + (fr.store_name || "-") + " | " + (fr.gid || "-") + " — <span class=\"error\">" + fr.error + "</span></div>";
                }
                summaryFailedList.innerHTML = listHtml;
            } else {
                summaryFailedList.style.display = "none";
            }
            showTelecrmSuccess("Sync complete. Success: " + result.success + ", Failed: " + result.failed + ".");
        }

        function addLog(message, type) {
            const logBox = document.getElementById("log-box");
            const entry = document.createElement("div");
            entry.className = "log-entry " + (type || "");
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.prepend(entry);
        }
    </script>
</body>
</html>

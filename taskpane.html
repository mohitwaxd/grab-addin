<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telecrm Sync Pro</title>
    <style>
        /* Same color palette as appscript.html (Telecrm purple + blue loader) */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 0; margin: 0; background-color: #FFF; color: #333; position: relative; min-height: 100vh; }
        .header { background: #4F38A2; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .container { padding: 20px; }
        .card { background: white; border-radius: 4px; padding: 15px; box-shadow: 0 1.6px 3.6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .ms-Button { background: #4F38A2; color: white; border: none; padding: 12px; width: 100%; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 2px; }
        .ms-Button:hover { background: #6a5acd; }
        .ms-Button:disabled { background: #c8c6c4; cursor: not-allowed; }

        .progress-container { margin-top: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
        .progress-bg { background: rgba(66, 133, 244, 0.2); height: 12px; width: 100%; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: #4285f4; height: 100%; width: 0%; transition: width 0.3s ease; }

        .log-box { background: #ffffff; border: 1px solid #e0e0e0; height: 200px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; padding: 10px; margin-top: 10px; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #f3f2f1; padding-bottom: 2px; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        .summary-stats { font-size: 13px; margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; }
        .summary-stats .stat-line { margin: 4px 0; }
        .summary-failed-list { font-size: 12px; margin-top: 10px; max-height: 180px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; background: #fff; }
        .summary-failed-list .failed-item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .summary-failed-list .failed-item:last-child { border-bottom: none; }
        .footer { font-size: 10px; color: #888; text-align: center; margin-top: 20px; }

        /* Overlay loader (same as AppScript getEnhancedLoaderStyles) */
        .telecrm-loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .telecrm-loader-overlay[hidden] { display: none; }
        .telecrm-loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        .telecrm-loader-message {
            color: #555;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .telecrm-loader-status {
            color: #888;
            font-size: 12px;
            text-align: center;
            max-width: 220px;
        }
        .telecrm-progress-container {
            width: 180px;
            height: 4px;
            background-color: rgba(66, 133, 244, 0.2);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }
        .telecrm-progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4285f4;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Overlay loader (shown while loading / sending - same as AppScript) -->
    <div id="telecrm-loader-overlay" class="telecrm-loader-overlay" hidden>
        <div class="telecrm-loader-content">
            <div id="telecrm-loader-message" class="telecrm-loader-message">Loading...</div>
            <div id="telecrm-loader-status" class="telecrm-loader-status"></div>
            <div id="telecrm-progress-container" class="telecrm-progress-container">
                <div id="telecrm-progress-bar" class="telecrm-progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>Telecrm Lead Sync</h1>
    </div>

    <div class="container">
        <div class="card">
            <p style="margin-top:0; font-size: 13px;">Send all data from the active sheet to Telecrm in one click.</p>
            <button id="run-button" class="ms-Button">Send All Data to CRM</button>
            
            <div id="progress-area" style="display:none;" class="progress-container">
                <div class="progress-label">
                    <span id="status-text">Processing...</span>
                    <span id="percent-text">0%</span>
                </div>
                <div class="progress-bg">
                    <div id="progress-bar" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 5px;">Activity Logs</div>
            <div id="log-box" class="log-box">
                <div class="log-entry">Ready. Click "Send All Data to CRM" to sync.</div>
            </div>
        </div>

        <div id="summary-card" class="card summary-card" style="display: none;">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Sync overview</div>
            <div id="summary-stats" class="summary-stats"></div>
            <div id="summary-failed-list" class="summary-failed-list" style="display: none;"></div>
        </div>
        <div class="footer">Connected to Telecrm API v2.0</div>
    </div>

    <!-- Load Office.js first so it runs before our script (required for Office.onReady) -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script>
        // Office.js requirement: call Office.onReady() as the first thing in your loading sequence.
        // See https://learn.microsoft.com/en-us/office/dev/add-ins/develop/initialize-add-in
        (function() {
            if (typeof Office === "undefined") {
                console.error("Office.js is not loaded. Run this add-in inside Excel.");
                return;
            }
            Office.onReady(function(info) {
                if (info.host === Office.HostType.Excel) {
                    var runBtn = document.getElementById("run-button");
                    if (runBtn) runBtn.onclick = handleSync;
                }
            });
        })();

        // CONFIGURATION: Replace with your actual details
        var CONFIG = {
            enterpriseId: "YOUR_ENTERPRISE_ID",
            token: "00b7c0bd-b8fb-43bd-915a-6981251312f51771223724641:aa7a74d0-7ae9-4726-a188-e57dfa7a823f",
            apiUrl: function(id) { return "https://next-api.telecrm.in/enterprise/68ca629e32c595c15bfc4f6f/autoupdatelead"; }
        };

        var LOG_SHEET_NAME = "Telecrm Sync Log";
        var LOG_HEADERS = ["Date/Time", "Excel Row", "Name", "Phone", "Email", "Error"];

        // ----- Loader helpers (same UX as AppScript Send Data dialog) -----
        function showTelecrmLoader(message, status) {
            var overlay = document.getElementById("telecrm-loader-overlay");
            var msgEl = document.getElementById("telecrm-loader-message");
            var statusEl = document.getElementById("telecrm-loader-status");
            var progressContainer = document.getElementById("telecrm-progress-container");
            if (overlay) {
                if (msgEl) msgEl.textContent = message || "Loading...";
                if (statusEl) statusEl.textContent = status || "";
                progressContainer.style.display = "block";
                overlay.hidden = false;
            }
        }
        function hideTelecrmLoader() {
            var overlay = document.getElementById("telecrm-loader-overlay");
            if (overlay) {
                overlay.style.opacity = "0";
                setTimeout(function() {
                    overlay.hidden = true;
                    overlay.style.opacity = "1";
                }, 300);
            }
        }
        function updateTelecrmLoaderStatus(status) {
            var el = document.getElementById("telecrm-loader-status");
            if (el) el.textContent = status;
        }
        function updateTelecrmProgress(percent) {
            var bar = document.getElementById("telecrm-progress-bar");
            if (bar) bar.style.width = (percent || 0) + "%";
        }
        function showTelecrmSuccess(message) {
            addLog("✓ " + message, "success");
        }

        async function handleSync() {
            var btn = document.getElementById("run-button");
            var progressArea = document.getElementById("progress-area");
            var progressBar = document.getElementById("progress-bar");
            var percentText = document.getElementById("percent-text");
            var statusText = document.getElementById("status-text");
            var logBox = document.getElementById("log-box");
            var summaryCard = document.getElementById("summary-card");
            var summaryStats = document.getElementById("summary-stats");
            var summaryFailedList = document.getElementById("summary-failed-list");

            btn.disabled = true;
            progressArea.style.display = "block";
            logBox.innerHTML = "";
            summaryCard.style.display = "none";

            showTelecrmLoader("Processing", "Reading sheet data...");
            updateTelecrmProgress(10);

            try {
                var result = await Excel.run(async (context) => {
                    var sheet = context.workbook.worksheets.getActiveWorksheet();
                    var range = sheet.getUsedRange();
                    range.load("values");

                    // Ensure "Telecrm Sync Log" sheet exists
                    var allSheets = context.workbook.worksheets;
                    allSheets.load("items/name");
                    await context.sync();

                    var names = allSheets.items.map(function(s) { return s.name; });
                    var logSheet = null;
                    var logLastRow = 0;
                    if (names.indexOf(LOG_SHEET_NAME) === -1) {
                        logSheet = context.workbook.worksheets.add(LOG_SHEET_NAME);
                        await context.sync();
                        var headerRange = logSheet.getRange("A1:F1");
                        headerRange.values = [LOG_HEADERS];
                        headerRange.format.font.bold = true;
                        logLastRow = 1;
                    } else {
                        logSheet = context.workbook.worksheets.getItem(LOG_SHEET_NAME);
                        var logUsed = logSheet.getUsedRange();
                        logUsed.load("rowCount");
                        await context.sync();
                        logLastRow = logUsed.rowCount;
                        if (logLastRow === 0) {
                            var headerRange = logSheet.getRange("A1:F1");
                            headerRange.values = [LOG_HEADERS];
                            headerRange.format.font.bold = true;
                            logLastRow = 1;
                        }
                    }
                    await context.sync();

                    var rows = range.values;
                    var dataLength = rows.length - 1;

                    if (dataLength <= 0) {
                        return { total: 0, success: 0, failed: 0, failedRows: [] };
                    }

                    updateTelecrmLoaderStatus("Sending to Telecrm...");
                    updateTelecrmProgress(20);

                    var successCount = 0;
                    var failCount = 0;
                    var failedRows = [];
                    var runTime = new Date().toLocaleString();

                    for (var i = 1; i < rows.length; i++) {
                        var row = rows[i];
                        var payload = {
                            "fields": {
                                "name": String(row[0] || ""),
                                "phone": String(row[1] || ""),
                                "email": String(row[2] || ""),
                                "status": String(row[3] || ""),
                            },
                            "actions": [{ "type": "ACTION_1001", "fields": { "notes": "Excel Add-in Sync" } }]
                        };

                        addLog("Row " + (i + 1) + " payload: " + JSON.stringify(payload), "");

                        var errMsg = "";
                        try {
                            var response = await fetch(CONFIG.apiUrl(CONFIG.enterpriseId), {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    "Authorization": "Bearer " + CONFIG.token
                                },
                                body: JSON.stringify(payload)
                            });

                            if (response.ok) {
                                successCount++;
                                addLog("Row " + (i + 1) + ": Success - " + (row[0] || ""), "success");
                            } else {
                                failCount++;
                                errMsg = "HTTP " + response.status;
                                addLog("Row " + (i + 1) + ": Failed (" + response.status + ")", "error");
                                failedRows.push({
                                    rowIndex: i + 1,
                                    name: String(row[0] || ""),
                                    phone: String(row[1] || ""),
                                    email: String(row[2] || ""),
                                    error: errMsg
                                });
                            }
                        } catch (e) {
                            failCount++;
                            errMsg = e.message || "Network Error";
                            addLog("Row " + (i + 1) + ": " + errMsg, "error");
                            failedRows.push({
                                rowIndex: i + 1,
                                name: String(row[0] || ""),
                                phone: String(row[1] || ""),
                                email: String(row[2] || ""),
                                error: errMsg
                            });
                        }

                        var progress = 20 + Math.round((i / dataLength) * 78);
                        updateTelecrmProgress(progress);
                        updateTelecrmLoaderStatus("Sending " + i + " of " + dataLength + "...");
                        progressBar.style.width = progress + "%";
                        percentText.innerText = Math.round((i / dataLength) * 100) + "%";
                        statusText.innerText = "Syncing " + i + " of " + dataLength;
                    }

                    updateTelecrmProgress(100);
                    updateTelecrmLoaderStatus("Complete!");
                    statusText.innerText = "Synchronization Complete!";
                    addLog("--- Finished ---", "");

                    // Write failed rows and summary to log sheet
                    var totalRows = dataLength;
                    var rowsToWrite = [];
                    for (var f = 0; f < failedRows.length; f++) {
                        var fr = failedRows[f];
                        rowsToWrite.push([runTime, fr.rowIndex, fr.name, fr.phone, fr.email, fr.error]);
                    }
                    rowsToWrite.push(["", "", "--- Summary ---", "Success: " + successCount, "Failed: " + failCount, "Total: " + totalRows]);

                    if (rowsToWrite.length > 0) {
                        var startRow = logLastRow + 1;
                        var endRow = logLastRow + rowsToWrite.length;
                        var writeRange = logSheet.getRange("A" + startRow + ":F" + endRow);
                        writeRange.values = rowsToWrite;
                    }

                    await context.sync();
                    return { total: totalRows, success: successCount, failed: failCount, failedRows: failedRows };
                });

                hideTelecrmLoader();
                showSummary(result);
            } catch (error) {
                hideTelecrmLoader();
                addLog("Error: " + error, "error");
                showSummary({ total: 0, success: 0, failed: 0, failedRows: [] });
            } finally {
                btn.disabled = false;
            }
        }

        function showSummary(result) {
            var summaryCard = document.getElementById("summary-card");
            var summaryStats = document.getElementById("summary-stats");
            var summaryFailedList = document.getElementById("summary-failed-list");
            if (!result || result.total === 0) {
                summaryCard.style.display = "none";
                return;
            }
            summaryCard.style.display = "block";
            var html = "<div class=\"stat-line\"><strong>Total rows:</strong> " + result.total + "</div>";
            html += "<div class=\"stat-line\"><span class=\"success\">Success:</span> " + result.success + "</div>";
            html += "<div class=\"stat-line\"><span class=\"error\">Failed:</span> " + result.failed + "</div>";
            html += "<div class=\"stat-line\" style=\"margin-top:8px;font-size:11px;color:#888;\">Failed details are logged in the \"" + LOG_SHEET_NAME + "\" sheet.</div>";
            summaryStats.innerHTML = html;

            if (result.failedRows && result.failedRows.length > 0) {
                summaryFailedList.style.display = "block";
                var listHtml = "<div style=\"font-weight:600;margin-bottom:6px;\">Failed rows:</div>";
                for (var i = 0; i < result.failedRows.length; i++) {
                    var fr = result.failedRows[i];
                    listHtml += "<div class=\"failed-item\">Row " + fr.rowIndex + " | " + (fr.name || "-") + " | " + (fr.phone || "-") + " | " + (fr.email || "-") + " — <span class=\"error\">" + fr.error + "</span></div>";
                }
                summaryFailedList.innerHTML = listHtml;
            } else {
                summaryFailedList.style.display = "none";
            }
            showTelecrmSuccess("Sync complete. Success: " + result.success + ", Failed: " + result.failed + ".");
        }

        function addLog(message, type) {
            const logBox = document.getElementById("log-box");
            const entry = document.createElement("div");
            entry.className = "log-entry " + (type || "");
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.prepend(entry);
        }
    </script>
</body>
</html>
